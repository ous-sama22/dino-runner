name: Release APK

# When a release is published, builds the APK from its tag and attaches it to the release with its
# SHA-256 in the release notes.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Build and attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          apk="dino-runner-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          gh release upload "$TAG" "$apk" --clobber
          notes=$(gh release view "$TAG" --json body --jq .body)
          printf '%s\n\nSHA-256 of `%s`: `%s`\n' "$notes" "$apk" "$sum" > notes.md
          gh release edit "$TAG" --notes-file notes.md
